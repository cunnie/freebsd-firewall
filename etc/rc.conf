hostname="avalon.nono.io"

ifconfig_igc0="DHCP"
ifconfig_igc0_ipv6="inet6 accept_rtadv"
dhcp6c_enable="YES"
dhcp6c_interfaces="igc0"
dhcp6c_flags="-d -D"

# --- LAN Interface & VLAN Setup ---
# Main trunk interface (up, 1500 MTU)
ifconfig_igc1="up"

# Create VLAN 2 on igc1 for Guest Network
vlans_igc1="2"

# --- Main LAN (Native / Untagged on igc1) ---
ifconfig_igc1="inet 10.9.9.10 netmask 255.255.255.0 mtu 1500 up"
ifconfig_igc1_ipv6="inet6 fe80::"
ifconfig_igc1_alias0="inet 10.9.9.1 netmask 255.255.255.255"
ifconfig_igc1_alias1="inet6 2601:645:8181:f980::a"
ifconfig_igc1_alias2="inet6 2601:645:8181:f980::" # default gateway

# --- Guest Network (VLAN 2) ---
ifconfig_igc1_2="inet 10.9.2.1/24 mtu 1500 up"
ifconfig_igc1_2_ipv6="inet6 fe80::2"
ifconfig_igc1_2_alias0="inet6 2601:645:8181:f982::" # default gateway

# Router Advertisement
rtadvd_enable="YES"
rtadvd_interfaces="igc1 igc1.2"

# Routing & Gateways
gateway_enable="YES"
ipv6_gateway_enable="YES"
ipv6_default_interface="igc1"

# PF Packet Filter
pf_enable="YES"
pflog_enable="YES"

# Services
sshd_enable="YES"
named_enable="YES"
dhcpd_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"
moused_nondefault_enable="NO"
dumpdev="AUTO"
clear_tmp_enable="YES"
wireguard_enable="YES"
wireguard_interfaces="wg0"
zfs_enable="YES"
