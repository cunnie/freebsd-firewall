hostname="avalon.nono.io"

ifconfig_igc0="DHCP"
ifconfig_igc0_ipv6="inet6 accept_rtadv"
dhcp6c_enable="YES"
dhcp6c_interfaces="igc0"

# --- Switch & Bridge Setup ---
cloned_interfaces="bridge0"
vlans_bridge0="1 2"

# Allow baby giant frames on member ports for 802.1Q tags
ifconfig_igc2="mtu 1504 up"
ifconfig_igc3="mtu 1504 up"
ifconfig_igc4="mtu 1504 up"
ifconfig_igc5="mtu 1504 up"

# Set bridge0 to 1504 so derived VLAN interfaces inherit a full 1500-byte payload
ifconfig_bridge0="mtu 1504 vlanfilter addm igc2 untagged 1 tagged 2 addm igc3 untagged 1 tagged 2 addm igc4 untagged 1 tagged 2 addm igc5 untagged 1 tagged 2 up"

# --- Main LAN (Native VLAN 1) ---
ifconfig_bridge0_1="inet 10.9.9.10 netmask 255.255.255.0 mtu 1500 up"
ifconfig_bridge0_1_ipv6="inet6 fe80::"
ifconfig_bridge0_1_alias0="inet 10.9.9.1 netmask 255.255.255.255"
ifconfig_bridge0_1_alias1="inet6 2601:645:8105:e060::a"
ifconfig_bridge0_1_alias2="inet6 2601:645:8105:e060::" # default gateway

# --- Guest Network (VLAN 2) ---
ifconfig_bridge0_2="inet 10.9.2.1/24 mtu 1500 up"
ifconfig_bridge0_2_ipv6="inet6 fe80::2"
ifconfig_bridge0_2_alias0="inet6 2601:645:8105:e062::" # default gateway

# Router Advertisement
rtadvd_enable="YES"
rtadvd_interfaces="bridge0.1 bridge0.2"

# Routing & Gateways
gateway_enable="YES"
ipv6_gateway_enable="YES"
ipv6_default_interface="bridge0.1"

# PF Packet Filter
pf_enable="YES"
pflog_enable="YES"

# Services
sshd_enable="YES"
named_enable="YES"
dhcpd_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"
moused_nondefault_enable="NO"
dumpdev="AUTO"
clear_tmp_enable="YES"
wireguard_enable="YES"
wireguard_interfaces="wg0"
zfs_enable="YES"
